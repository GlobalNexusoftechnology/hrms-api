name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t mubasshir090/hrms-backend:latest \
            .

      # 4. Push Docker image
      - name: Push Docker image
        run: |
          docker push mubasshir090/hrms-backend:latest

      # 5. Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # 6. Deploy to VPS
      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'

            set -e

            echo "===================================="
            echo "Starting backend deployment"
            echo "===================================="

            cd /root/hrms-api

            echo "Pulling latest backend image..."
            docker compose -f docker-compose.prod.yml pull backend

            echo "Starting backend container..."
            docker compose -f docker-compose.prod.yml up -d backend

            echo "Waiting for backend..."
            sleep 10

            echo "Running database migrations..."
            docker exec hrms_backend_prod npm run migration:run:prod

            echo "Checking backend container..."
            docker ps --filter "name=hrms_backend_prod"

            echo "===================================="
            echo "Backend deployment completed"
            echo "===================================="

          EOF