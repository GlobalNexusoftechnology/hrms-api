version: '3.8'

services:
  backend:
    image: yourusername/hrms-backend:latest
    container_name: hrms_backend_prod
    expose:
      - "6543"
    environment:
      - NODE_ENV=production
      # Update with your Hostinger DB credentials
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./.env
    networks:
      - hrms-network
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: yourusername/hrms-frontend:latest
    container_name: hrms_frontend_prod
    ports:
      - "80:80"
    networks:
      - hrms-network
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    container_name: hrms_redis_prod
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - hrms-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hrms-network:
    driver: bridge

volumes:
  redis_data:
